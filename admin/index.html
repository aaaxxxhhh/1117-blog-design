<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
<title>관리자 — slow days</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap"></noscript>
<link rel="stylesheet" href="../assets/style.css?v=6">
<style>
  .menu { display:flex; flex-direction:column; align-items:flex-start; gap:6px; font-weight:500; }
  .menu a, .menu button { border:0; background:none; padding:0; cursor:pointer; font-size:inherit; text-align:left; }
  .stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); border-top:1px solid var(--ink); border-bottom:1px solid var(--ink); margin-bottom:32px; }
  .stats div { padding:14px 0; } .stats b { display:block; margin-top:4px; font-size:40px; line-height:1; font-weight:400; }
  .tools { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .tools input, .tools select { height:32px; border:0; background:var(--soft); padding:0 8px; font-size:var(--wsm-fs); }
  .st { display:flex; align-items:center; gap:8px; } .st i { width:6px; height:6px; border-radius:50%; display:inline-block; }
  .acts { display:flex; justify-content:flex-end; gap:12px; }
  .acts a, .acts button { border:0; background:none; padding:0; cursor:pointer; font-size:inherit; }
  .acts button { color:var(--danger); }
  .dash.row2 { grid-template-columns:calc(43.3vw - var(--wsm-pad)) minmax(0,1fr); }
  .head2 { display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:16px; }
  @media (max-width:640px) { .stats { grid-template-columns:repeat(2,minmax(0,1fr)); } .dash.row2 { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header class="wsm-top">
  <span class="icons hint" style="top:calc(var(--wsm-top) + 2px)">/admin</span>
  <div class="right"><a class="logo-s" href="../">slow days</a><span class="dot" aria-hidden="true"></span><span id="who">관리자</span></div>
</header>

<!-- 로그인 화면 -->
<section id="loginView" class="wsm-page" hidden>
  <h1 class="wsm-title">Admin 관리자 로그인</h1>
  <div class="row2">
    <div class="lab">Sign in 로그인<p class="hint" style="font-weight:400;margin:6px 0 0">관리자로 등록된 계정만 들어올 수 있어요.</p></div>
    <form id="loginForm" class="fld" style="max-width:480px;gap:18px">
      <div style="display:flex;flex-direction:column;gap:6px"><label for="email" class="hint">이메일</label>
        <input id="email" class="line-in" type="email" autocomplete="username" required></div>
      <div style="display:flex;flex-direction:column;gap:6px"><label for="pw" class="hint">비밀번호</label>
        <input id="pw" class="line-in" type="password" autocomplete="current-password" required></div>
      <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="keep"> 이 기기에서 로그인 유지</label>
      <button class="btn dark" type="submit" id="loginBtn">로그인하고 관리자 페이지 열기</button>
      <p class="msg err" id="loginMsg" role="alert"></p>
      <button type="button" id="resetBtn" style="border:0;background:none;padding:0;text-align:left;font-size:inherit;color:var(--sub);cursor:pointer">비밀번호를 잊었나요? 재설정 메일 받기</button>
    </form>
  </div>
</section>

<!-- 관리자 · 글 관리 -->
<section id="dashView" class="wsm-page" hidden>
  <div class="head2" style="margin-bottom:60px"><h1 class="wsm-title" style="margin-bottom:0">Posts 글 관리</h1><a class="btn dark" href="../write/">+ 새 글 쓰기</a></div>
  <div class="row2 dash">
    <nav class="menu lab" aria-label="관리 메뉴">
      <a href="./">Posts 글 관리</a>
      <a href="stats/">Stats 방문 통계</a>
      <a href="../write/">Write 새 글 쓰기</a>
      <a href="../" target="_blank" rel="noopener" class="muted" style="margin-top:18px">블로그 보기 →</a>
      <button type="button" id="logoutBtn" class="muted">로그아웃</button>
    </nav>
    <main style="min-width:0">
      <div class="stats" id="stats"></div>
      <div class="tools">
        <label for="aq" class="sr">글 검색</label><input id="aq" type="search" placeholder="제목으로 찾기" style="flex:1 1 200px">
        <label for="fs" class="sr">상태</label><select id="fs"><option value="">전체 상태</option><option value="published">발행</option><option value="scheduled">예약</option><option value="draft">임시 저장</option></select>
        <label for="fc" class="sr">분류</label><select id="fc"><option value="">전체 분류</option><option value="essay">에세이</option><option value="daily">일상</option><option value="space">공간</option><option value="books">책</option></select>
      </div>
      <div style="overflow-x:auto" id="table"></div>
      <p class="msg" id="dashMsg" role="status"></p>
    </main>
  </div>
</section>

<footer class="wsm-foot">© 2026 slow days · 관리자 전용 화면</footer>

<script type="module">
import { onUser, login, logout, resetPw, getAllPosts, removePost, esc, fmtDate } from "../assets/fb.js?v=5";
const $ = (id) => document.getElementById(id);
const KO = { essay: "에세이", daily: "일상", space: "공간", books: "책" };
const ST = { published: ["발행", "#2F5D50"], scheduled: ["예약", "#1F3A93"], draft: ["임시 저장", "#8A8A8A"] };
const stateOf = (p) => p.status !== "published" ? "draft" : (p.publishedAt && p.publishedAt.toMillis() > Date.now() ? "scheduled" : "published");
let all = [];

onUser(async (user) => {
  if (user) { try { localStorage.setItem("sd_internal", "1"); } catch {} } // GA 내부 방문 제외 표시
  $("loginView").hidden = !!user; $("dashView").hidden = !user;
  $("who").textContent = user ? user.email : "관리자";
  if (user) await load();
});

$("loginForm").onsubmit = async (e) => {
  e.preventDefault(); $("loginMsg").textContent = ""; $("loginBtn").disabled = true;
  try { await login($("email").value.trim(), $("pw").value, $("keep").checked); }
  catch (err) { $("loginMsg").textContent = "이메일 또는 비밀번호가 맞지 않아요."; console.error(err.code); }
  $("loginBtn").disabled = false;
};
$("resetBtn").onclick = async () => {
  const em = $("email").value.trim();
  if (!em) { $("loginMsg").textContent = "이메일을 먼저 입력해 주세요."; return; }
  try { await resetPw(em); $("loginMsg").textContent = "재설정 메일을 보냈어요. 메일함을 확인해 주세요."; } catch { $("loginMsg").textContent = "메일을 보내지 못했어요. 이메일을 확인해 주세요."; }
};
$("logoutBtn").onclick = () => logout();

async function load() {
  try { all = await getAllPosts(); } catch (e) { $("dashMsg").textContent = "글을 불러오지 못했어요. 관리자 권한이 있는 계정인지 확인해 주세요."; console.error(e); return; }
  const c = { published: 0, scheduled: 0, draft: 0 }; all.forEach((p) => c[stateOf(p)]++);
  $("stats").innerHTML = [["전체 글", all.length], ["발행", c.published], ["예약", c.scheduled], ["임시 저장", c.draft]]
    .map(([l, n]) => `<div><span class="hint">${l}</span><b>${n}</b></div>`).join("");
  draw();
}
function draw() {
  const w = $("aq").value.trim().toLowerCase(), fs = $("fs").value, fc = $("fc").value;
  const rows = all.filter((p) => (!fs || stateOf(p) === fs) && (!fc || p.category === fc) && (!w || `${p.titleEn} ${p.titleKo}`.toLowerCase().includes(w)));
  $("table").innerHTML = `<div class="tbl-row tbl-head"><span>제목</span><span>분류</span><span>상태</span><span>발행일</span><span style="text-align:right">관리</span></div>` +
    (rows.length ? rows.map((p) => { const s = ST[stateOf(p)]; return `<div class="tbl-row">
      <a href="../post/?id=${encodeURIComponent(p.id)}" target="_blank" rel="noopener" class="upper">${esc(p.titleEn)} · ${esc(p.titleKo)}</a>
      <span>${KO[p.category] || ""}</span><span class="st"><i style="background:${s[1]}"></i>${s[0]}</span>
      <span class="muted">${fmtDate(p.publishedAt) || "-"}</span>
      <span class="acts"><a href="../write/?id=${encodeURIComponent(p.id)}">수정</a><button type="button" data-del="${esc(p.id)}" data-t="${esc(p.titleKo || p.titleEn)}">삭제</button></span></div>`; }).join("")
    : `<p class="empty">글이 없어요. "+ 새 글 쓰기"로 첫 글을 써 보세요.</p>`);
}
$("table").onclick = async (e) => {
  const b = e.target.closest("[data-del]"); if (!b) return;
  if (!confirm(`"${b.dataset.t}" 글을 삭제할까요? 삭제하면 되돌릴 수 없어요.`)) return;
  try { await removePost(b.dataset.del); $("dashMsg").textContent = "삭제했어요."; await load(); } catch { $("dashMsg").textContent = "삭제하지 못했어요."; }
};
["aq", "fs", "fc"].forEach((k) => $(k).addEventListener("input", draw));
</script>
</body>
</html>
