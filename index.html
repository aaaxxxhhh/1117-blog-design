<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slow days — 느리게 보는 생활 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/style.css">
<style>
  /* ① 첫 화면 : WSM 스타일 */
  .intro { position:relative; min-height:1040px; overflow:hidden; }
  .logo-big { margin:0; padding:72px 0 0 300px; font-size:88px; line-height:.9; font-weight:600; letter-spacing:-.045em; }
  .strip { position:absolute; left:-230px; top:340px; display:flex; gap:30px; align-items:flex-start; white-space:nowrap; }
  .strip a { flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:22px; font-size:12px; }
  .strip .ph { width:100%; }
  .down { position:absolute; left:50%; bottom:24px; transform:translateX(-50%); width:44px; height:44px; display:flex; align-items:center; justify-content:center; }
  /* ② 스크롤 아래 : PW 스타일 */
  .lower { display:flex; align-items:flex-start; } .lower .side { position:sticky; flex:0 0 123px; }
  main.home { flex:1; min-width:0; padding:96px 24px 0 0; max-width:1308px; }
  .quote { margin:0; padding:150px 0 140px; text-align:center; }
  .quote blockquote { margin:0 auto; max-width:900px; font-family:'Noto Serif KR',serif; font-size:30px; line-height:1.4; }
  .quote figcaption { margin-top:18px; font-size:10px; line-height:1.6; text-transform:uppercase; letter-spacing:.04em; }
  .single { padding-top:140px; }
  .single .frame { width:min(100%,412px); }
  .recs { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:24px; padding-top:150px; }
  .rec { position:relative; aspect-ratio:4/5; }
  .rec span { position:absolute; right:6px; bottom:6px; background:#111; color:#fff; font-size:8px; padding:2px 5px; text-transform:uppercase; letter-spacing:.06em; }
  .about { padding-top:120px; }
  .about p { margin:0; font-size:24px; line-height:1.32; }
  .about a { display:inline-flex; margin-top:28px; min-height:44px; align-items:center; font-size:13px; font-weight:500; text-transform:uppercase; letter-spacing:.04em; border-bottom:1px solid #111; }
  footer.home { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:24px; padding:160px 0 24px; font-size:10px; line-height:1.6; text-transform:uppercase; letter-spacing:.04em; }
  footer.home nav { display:flex; flex-direction:column; }
  @media (max-width:1024px) { .logo-big { padding-left:120px; font-size:72px; } .recs { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media (max-width:640px) {
    .intro { min-height:844px; } .logo-big { padding:56px 0 0 54px; font-size:52px; }
    .strip { left:10px; top:270px; gap:20px; }
    .strip a { width:280px !important; margin-top:0 !important; }
    .strip a:nth-child(even) { margin-top:80px !important; }
    .strip a .ph { height:340px !important; }
    .lower { display:block; }
    main.home { padding:40px 20px 0; }
    .recs { grid-template-columns:1fr; } .quote { padding:80px 0; } .quote blockquote { font-size:21px; }
    .about p { font-size:19px; } footer.home { grid-template-columns:repeat(2,minmax(0,1fr)); padding-top:80px; }
  }
</style>
</head>
<body>

<section class="intro" aria-label="첫 화면">
  <header class="wsm-top">
    <nav aria-label="빠른 메뉴" style="display:flex;gap:4px">
      <a class="icon-btn" href="list/" aria-label="전체 글 보기"><svg aria-hidden="true" width="20" height="14" viewBox="0 0 20 14" fill="none" stroke="#111" stroke-width="1.3"><line x1="0" y1="1" x2="20" y2="1"/><line x1="0" y1="7" x2="20" y2="7"/><line x1="0" y1="13" x2="20" y2="13"/></svg></a>
      <a class="icon-btn" href="list/?search=1" aria-label="검색"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="17" y1="17" x2="22" y2="22"/></svg></a>
    </nav>
    <a href="list/?cat=essay" style="display:flex;align-items:center;gap:8px;font-size:12px;min-height:44px"><span class="dot" aria-hidden="true"></span>Seoul · 에세이</a>
  </header>
  <h1 class="logo-big">slow days</h1>
  <div class="strip" id="strip"></div>
  <a class="down" href="#posts" aria-label="아래로 이동"><svg aria-hidden="true" width="20" height="11" viewBox="0 0 22 12" fill="none" stroke="#111" stroke-width="1.3"><polyline points="1 1 11 11 21 1"/></svg></a>
</section>

<div class="lower" id="posts">
  <div id="side"></div>
  <main class="home">
    <div class="grid3" id="row1"></div>
    <figure class="quote">
      <blockquote id="quote">“빨리 지나가는 하루를 천천히 다시 봅니다.”</blockquote>
      <figcaption>slow days</figcaption>
    </figure>
    <div class="grid3" id="row2"></div>
    <div id="single"></div>
    <div class="recs">
      <a class="rec ph" href="list/?cat=books" style="--tone:#E4DED3">[추천 책 · 협업 배너]<span>Recommended</span></a>
      <a class="rec ph" href="list/?cat=space" style="--tone:#C9CFC8">[추천 공간 · 협업 배너]<span>Recommended</span></a>
      <a class="rec ph" href="list/?cat=daily" style="--tone:#D6CEC4">[추천 물건 · 협업 배너]<span>Recommended</span></a>
    </div>
    <div class="about">
      <p>slow days는 빨리 지나가는 하루를 천천히 다시 보는 생활 기록입니다. 에세이, 일상, 공간, 책을 통해 오래 곁에 두고 싶은 장면을 모읍니다.</p>
      <a href="list/">전체 글 보기 · All Stories →</a>
    </div>
    <div id="long"></div>
    <footer class="home">
      <nav aria-label="분류"><a href="list/?cat=essay">Essay 에세이</a><a href="list/?cat=daily">Daily 일상</a><a href="list/?cat=space">Space 공간</a><a href="list/?cat=books">Books 책</a></nav>
      <nav aria-label="글"><a href="list/">All 전체 글</a><a href="list/?search=1">Search 검색</a></nav>
      <nav aria-label="채널"><a href="https://instagram.com" target="_blank" rel="noopener">Instagram</a></nav>
      <nav aria-label="기타"><a href="#">Back to top ↑</a><a href="admin/" class="muted">Admin</a></nav>
    </footer>
  </main>
</div>

<script type="module">
import { getPublished, cardHTML, sideHTML, esc, safeUrl } from "./assets/fb.js";
document.getElementById("side").outerHTML = sideHTML("", "");
const T = ["#E2CFCB","#D9D4CC","#C9CFC8","#E4DED3","#BFC3C7","#D6CEC4","#CCD2CB"];
const W = [330, 330, 690, 330, 330, 690, 330], H = [413, 427, 479, 413, 495, 479, 427], M = [154, 0, 121, 0, 113, 121, 0];
let list = [];
try { list = await getPublished(); } catch (e) { console.error(e); }
const strip = document.getElementById("strip");
if (list.length) {
  strip.innerHTML = Array.from({ length: 7 }, (_, i) => {
    const p = list[i % list.length];
    const url = safeUrl(p.coverUrl), cat = { essay: "에세이", daily: "일상", space: "공간", books: "책" }[p.category] || "";
    return `<a href="post/?id=${encodeURIComponent(p.id)}" style="width:${W[i]}px;margin-top:${M[i]}px"><div class="ph" style="height:${H[i]}px;--tone:${T[i]}">${url ? `<img src="${esc(url)}" alt="${esc(p.titleKo || p.titleEn)}">` : "[사진]"}</div>${esc(p.titleKo || p.titleEn)} - ${cat}</a>`;
  }).join("");
  document.getElementById("row1").innerHTML = list.slice(0, 3).map((p, i) => cardHTML(p, i, "")).join("");
  document.getElementById("row2").innerHTML = list.slice(3, 6).map((p, i) => cardHTML(p, i + 3, "")).join("");
  if (list[6]) document.getElementById("single").innerHTML = `<div class="single">${cardHTML(list[6], 6, "")}</div>`;
  if (list[7]) document.getElementById("long").innerHTML = `<div class="single" style="padding-top:140px">${cardHTML(list[7], 7, "")}</div>`;
} else {
  strip.innerHTML = W.map((w, i) => `<a href="list/" style="width:${w}px;margin-top:${M[i]}px"><div class="ph" style="height:${H[i]}px;--tone:${T[i]}">[사진]</div>첫 글을 기다리는 중</a>`).join("");
  document.getElementById("row1").innerHTML = `<p class="empty" style="grid-column:1/-1">아직 발행된 글이 없어요. 관리자 페이지에서 첫 글을 써 보세요.</p>`;
}
</script>
</body>
</html>
