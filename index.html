<link rel="stylesheet" href="assets/style.css?v=6">
<style>
  /* ① 첫 화면 : WSM 홈과 같은 크기·위치 (1440 / 768 / 390px에서 잰 값) */
  .intro { position:relative; overflow:hidden; font-size:var(--wsm-fs); line-height:1.4; padding-bottom:80px; }
  .logo-big { position:absolute; margin:0; left:20.8vw; top:153px; font-size:4.25vw; line-height:1; font-weight:600; letter-spacing:-.045em; }
  .strip { display:flex; align-items:flex-start; gap:2.08vw; padding:calc(19vw - (var(--wsm-top) * 2 + 20px)) 0 0 1.04vw; width:max-content; }
  .strip a { flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center; }
  .strip a.p { width:22.9vw; } .strip a.p .ph { height:calc(22.9vw * 1.25); }
  .strip a.l { width:47.9vw; margin-top:9vw; } .strip a.l .ph { height:calc(47.9vw * .694); }
  .strip .ph { width:100%; }
  .down { display:flex; justify-content:center; padding-top:40px; }
  /* ② 스크롤 아래 : PW 홈과 같은 크기 */
  .lower { display:flex; align-items:flex-start; }
  .lower .side { position:sticky; flex:0 0 123px; }
  main.home { flex:1; min-width:0; padding:96px 24px 0 10px; }
  .quote { margin:0; padding:150px 0 140px; text-align:center; }
  .quote blockquote { margin:0 auto; max-width:900px; font-family:var(--serif); font-size:var(--pw-title); line-height:1; }
  .quote figcaption { margin-top:18px; font-size:var(--pw-side); line-height:1.4; text-transform:uppercase; }
  .single { padding-top:140px; display:flex; justify-content:center; }
  .single .card { width:calc((100% - 48px) / 3); }
  .about { padding-top:120px; padding-inline:calc(123px * 2); } /* 좌우 여백 = 왼쪽 사이드 메뉴 폭(123px)의 2배 */
  .about p { margin:0; font-size:calc(var(--pw-title) * 0.7); line-height:1.1; word-break:keep-all; } /* 기존 글자 크기의 70% */
  .about a { display:inline-flex; margin-top:24px; font-size:var(--pw-meta); text-transform:uppercase; border-bottom:1px solid #111; }
  footer.home { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:24px; padding:160px 0 24px; font-size:var(--pw-side); line-height:1.4; text-transform:uppercase; }
  footer.home nav { display:flex; flex-direction:column; }
  @media (max-width:1023px) {
    .logo-big { left:9.6vw; top:122px; font-size:4.05vw; }
    .strip { gap:26px; padding:calc(248px - (var(--wsm-top) * 2 + 20px)) 0 0 13px; }
    .strip a.p { width:51.6vw; } .strip a.p .ph { height:calc(51.6vw * 1.25); }
    .strip a.l { width:96.6vw; margin-top:49.6vw; } .strip a.l .ph { height:calc(96.6vw * .694); }
    .lower { display:block; }
    .about { padding-inline:0; } /* 1024px 미만: 사이드 메뉴가 위쪽 줄로 바뀌어 폭이 없음 */
    main.home { padding:64px var(--pw-pad) 0; }
    .single .card { width:calc((100% - 26px) / 3); }
    footer.home { font-size:var(--pw-meta); }
  }
  @media (max-width:640px) {
    .logo-big { left:68px; top:100px; font-size:29px; }
    .strip { gap:24px; padding:calc(209px - (var(--wsm-top) * 2 + 20px)) 0 0 12px; }
    .strip a.p { width:73.8vw; } .strip a.p .ph { height:calc(73.8vw * 1.25); }
    .strip a.l { width:93.8vw; margin-top:82vw; } .strip a.l .ph { height:calc(93.8vw * .694); }
    .quote { padding:80px 0; } .quote blockquote { font-size:23.8px; line-height:1.2; }
    .single .card { width:100%; }
    footer.home { grid-template-columns:repeat(2,minmax(0,1fr)); padding-top:80px; }
  }
</style>
</head>
<body>

<section class="intro" aria-label="첫 화면">
  <header class="wsm-top">
    <nav class="icons" aria-label="빠른 메뉴">
      <a class="icon" href="list/" aria-label="전체 글 보기"><svg aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="#111" stroke-width="1.3"><line x1="1" y1="5" x2="19" y2="5"/><line x1="1" y1="10" x2="19" y2="10"/><line x1="1" y1="15" x2="19" y2="15"/></svg></a>
      <a class="icon" href="list/?search=1" aria-label="검색"><svg aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="#111" stroke-width="1.4"><circle cx="8.5" cy="8.5" r="6.5"/><line x1="13.3" y1="13.3" x2="19" y2="19"/></svg></a>
    </nav>
    <a class="right" href="list/?cat=essay"><span class="dot" aria-hidden="true"></span>Seoul · 에세이</a>
  </header>
  <h1 class="logo-big">slow days</h1>
  <div class="strip" id="strip"></div>
  <div class="down"><a class="icon" href="#posts" aria-label="아래로 이동"><svg aria-hidden="true" viewBox="0 0 22 12" fill="none" stroke="#111" stroke-width="1.3"><polyline points="1 1 11 11 21 1"/></svg></a></div>
</section>

<div class="lower" id="posts">
  <div id="side"></div>
  <main class="home">
    <div class="grid3" id="row1"></div>
    <figure class="quote">
      <blockquote>“빨리 지나가는 하루를 천천히 다시 봅니다.”</blockquote>
      <figcaption>slow days</figcaption>
    </figure>
    <div class="grid3" id="row2"></div>
    <div id="single"></div>
    <div class="about">
      <p>slow days는 빨리 지나가는 하루를 천천히 다시 보는 생활 기록입니다. 에세이, 일상, 공간, 책을 통해 오래 곁에 두고 싶은 장면을 모읍니다.</p>
      <a href="list/">전체 글 보기 · All Stories →</a>
    </div>
    <footer class="home">
      <nav aria-label="분류"><a href="list/?cat=essay">Essay 에세이</a><a href="list/?cat=daily">Daily 일상</a><a href="list/?cat=space">Space 공간</a><a href="list/?cat=books">Books 책</a></nav>
      <nav aria-label="글"><a href="list/">All 전체 글</a><a href="list/?search=1">Search 검색</a></nav>
      <nav aria-label="채널"><a href="https://instagram.com" target="_blank" rel="noopener">Instagram</a></nav>
      <nav aria-label="기타"><a href="#">Back to top ↑</a><a href="admin/" class="muted">Admin</a></nav>
    </footer>
  </main>
</div>

<script type="module">
import { getPublished, cardHTML, sideHTML, esc, safeSrc, postHref } from "./assets/fb.js?v=5";
import { pageView } from "./assets/ga.js?v=4";
pageView();
document.getElementById("side").outerHTML = sideHTML("", "");
const T = ["#E2CFCB","#D9D4CC","#C9CFC8","#E4DED3","#BFC3C7","#D6CEC4","#CCD2CB"];
const KIND = ["p", "l", "p", "p", "l", "p", "p"];   // 세로(p) · 가로(l) 사진이 섞이는 WSM 배치
const CAT = { essay: "에세이", daily: "일상", space: "공간", books: "책" };
let list = [];
try { list = await getPublished(); } catch (e) { console.error(e); }
const strip = document.getElementById("strip");
if (list.length) {
  // 글 1개 = 사진 1장 (같은 글을 반복해서 채우지 않음)
  strip.innerHTML = list.slice(0, 7).map((p, i) => {
    const src = safeSrc(p.coverThumb || p.coverUrl);
    return `<a class="${KIND[i]}" href="${postHref(p, "")}"><div class="ph" style="--tone:${T[i]}">${src ? `<img src="${esc(src)}" alt="${esc(p.titleKo || p.titleEn)}">` : "[사진]"}</div>${esc(p.titleKo || p.titleEn)} - ${CAT[p.category] || ""}</a>`;
  }).join("");
  document.getElementById("row1").innerHTML = list.slice(0, 3).map((p, i) => cardHTML(p, i, "")).join("");
  document.getElementById("row2").innerHTML = list.slice(3, 6).map((p, i) => cardHTML(p, i + 3, "")).join("");
  if (list[6]) document.getElementById("single").innerHTML = `<div class="single">${cardHTML(list[6], 6, "")}</div>`;
} else {
  strip.innerHTML = KIND.slice(0, 4).map((k, i) => `<a class="${k}" href="list/"><div class="ph" style="--tone:${T[i]}">[사진]</div>첫 글을 기다리는 중</a>`).join("");
  document.getElementById("row1").innerHTML = `<p class="empty">아직 발행된 글이 없어요.</p>`;
}
</script>
</body>
</html>
