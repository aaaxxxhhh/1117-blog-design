<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글 목록 — slow days</title>
<meta name="description" content="빨리 지나가는 하루를 천천히 다시 보는 생활 기록. 에세이, 일상, 공간, 책 이야기를 모읍니다.">
<link rel="canonical" href="https://aaaxxxhhh.github.io/1117-blog-design/list/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="slow days">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="글 목록 — slow days">
<meta property="og:description" content="빨리 지나가는 하루를 천천히 다시 보는 생활 기록. 에세이, 일상, 공간, 책 이야기를 모읍니다.">
<meta property="og:url" content="https://aaaxxxhhh.github.io/1117-blog-design/list/">
<meta property="og:image" content="https://aaaxxxhhh.github.io/1117-blog-design/og/default.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../assets/style.css?v=5">
<style>
  /* PW /articles와 같은 위치·크기 (1440px: 검색창 242~1198px, 버튼 194px, 4열 194px 칸) */
  .bar { position:sticky; top:0; z-index:4; background:#fff; height:44px; font-size:var(--pw-ui); text-transform:uppercase; }
  .bar input { position:absolute; left:242px; right:242px; top:0; height:20px; border:0; background:var(--soft); padding:0 6px; font-size:inherit; text-transform:uppercase; }
  .bar .ctrl { position:absolute; right:24px; top:0; width:194px; display:flex; flex-direction:column; gap:4px; }
  .bar .ctrl > div, .bar .ctrl > button { height:20px; background:var(--soft); display:flex; align-items:center; }
  .bar button { border:0; background:none; padding:0 6px; cursor:pointer; font-size:inherit; text-transform:uppercase; color:#9A9A9A; height:20px; }
  .bar button.on, .bar #fBtn { color:var(--ink); }
  .bar .ctrl > div button + button { margin-left:auto; }
  .chips { display:none; gap:6px; flex-wrap:wrap; justify-content:flex-end; margin:8px 24px 0 0; font-size:var(--pw-ui); text-transform:uppercase; }
  .chips.open { display:flex; }
  .chips a { height:20px; padding:0 8px; background:var(--soft); display:flex; align-items:center; }
  .chips a.on { background:var(--ink); color:#fff; }
  #out { padding:68px 242px 0 0; }
  .idx { overflow-x:auto; padding-left:242px; }
  .idx .r { display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:12px; min-height:36px; align-items:center; border-bottom:1px solid var(--line); font-size:var(--pw-list-title); min-width:600px; }
  .idx .h { min-height:0; padding-bottom:8px; border-bottom:1px solid var(--ink); font-size:var(--pw-list-meta); text-transform:uppercase; color:var(--sub); }
  .top { display:flex; justify-content:center; padding:120px 0 40px; font-size:var(--pw-side); text-transform:uppercase; }
  main.page { padding:0; }
  @media (max-width:1023px) {
    .bar { height:46px; top:40px; }
    .bar input { left:var(--pw-pad); right:calc(113px + var(--pw-pad) * 2); height:21px; }
    .bar .ctrl { right:var(--pw-pad); width:113px; }
    .bar .ctrl > div, .bar .ctrl > button, .bar button { height:21px; }
    .chips { margin-right:var(--pw-pad); }
    #out { padding:35px var(--pw-pad) 0; }
    .idx { padding-left:0; }
  }
  @media (max-width:640px) {
    .bar { height:72px; }
    .bar .ctrl { left:var(--pw-pad); width:auto; display:block; }
    .bar .ctrl > div { position:absolute; left:0; right:0; top:0; }
    .bar #fBtn { position:absolute; left:0; right:0; top:51px; background:var(--soft); text-align:left; }
    .bar input { left:var(--pw-pad); right:var(--pw-pad); top:25px; }
    #out { padding-top:34px; }
  }
</style>
</head>
<body>
<div id="side"></div>
<main class="with-side page">
  <div class="bar">
    <label for="q" class="sr">글 검색</label>
    <input id="q" type="search" placeholder="Search…">
    <div class="ctrl">
      <div><button type="button" id="vGrid" class="on">Grid</button><button type="button" id="vIdx">Index</button></div>
      <button type="button" id="fBtn">Filter +</button>
    </div>
  </div>
  <div class="chips" id="chips"></div>
  <div id="out"><p class="empty">글을 불러오는 중…</p></div>
  <div class="top"><a href="#">Back to top ↑</a></div>
</main>

<script type="module">
import { getPublished, cardHTML, sideHTML, esc, fmtDate, CATS, CAT_EN } from "../assets/fb.js?v=4";
import { pageView, track } from "../assets/ga.js?v=3";
pageView();
const qs = new URLSearchParams(location.search);
const cat = qs.get("cat") || "";
document.getElementById("side").outerHTML = sideHTML("../", cat);
const chips = document.getElementById("chips");
chips.innerHTML = [["", "전체 All"], ...Object.entries(CATS)].map(([k, v]) => `<a href="./${k ? "?cat=" + k : ""}" class="${k === cat ? "on" : ""}">${v}</a>`).join("");
if (cat) chips.classList.add("open");
const fBtn = document.getElementById("fBtn");
const syncF = () => (fBtn.textContent = "Filter " + (chips.classList.contains("open") ? "−" : "+"));
fBtn.onclick = () => { chips.classList.toggle("open"); syncF(); }; syncF();
const q = document.getElementById("q");
if (qs.get("q")) q.value = qs.get("q");
if (qs.get("search")) q.focus();

let view = "grid", all = [], lastCount = 0;
try { all = await getPublished(); } catch (e) { console.error(e); }
function draw() {
  const word = q.value.trim().toLowerCase();
  const list = all.filter((p) => (!cat || p.category === cat) &&
    (!word || [p.titleEn, p.titleKo, p.intro, (p.tags || []).join(" ")].join(" ").toLowerCase().includes(word)));
  lastCount = list.length;
  const out = document.getElementById("out");
  if (!list.length) { out.innerHTML = `<p class="empty">${all.length ? "조건에 맞는 글이 없어요." : "아직 발행된 글이 없어요."}</p>`; return; }
  out.innerHTML = view === "grid"
    ? `<div class="grid4">${list.map((p, i) => cardHTML(p, i, "../")).join("")}</div>`
    : `<div class="idx"><div class="r h"><span>Title 제목</span><span>Type 분류</span><span>Author 작성자</span><span>Date 발행일</span></div>${list.map((p) =>
        `<a class="r" href="../post/?id=${encodeURIComponent(p.id)}"><span class="upper">${esc(p.titleEn)} · ${esc(p.titleKo)}</span><span>${esc(CAT_EN[p.category] || "")}</span><span>${esc(p.author)}</span><span>${fmtDate(p.publishedAt)}</span></a>`).join("")}</div>`;
}
const vGrid = document.getElementById("vGrid"), vIdx = document.getElementById("vIdx");
vGrid.onclick = () => { view = "grid"; vGrid.classList.add("on"); vIdx.classList.remove("on"); draw(); };
vIdx.onclick = () => { view = "index"; vIdx.classList.add("on"); vGrid.classList.remove("on"); draw(); };
// 검색: 검색어를 주소(?q=)에 남기고, 입력이 멈추면 search 이벤트 1회 전송
let timer = 0, sent = qs.get("q") || "";
q.oninput = () => {
  draw();
  clearTimeout(timer);
  timer = setTimeout(() => {
    const word = q.value.trim();
    const u = new URL(location.href);
    u.searchParams.delete("search");
    if (word) u.searchParams.set("q", word); else u.searchParams.delete("q");
    history.replaceState(null, "", u.pathname + u.search + u.hash);
    if (word && word !== sent) { sent = word; track("search", { search_term: word, results_count: lastCount }); }
  }, 800);
};
draw();
</script>
</body>
</html>
