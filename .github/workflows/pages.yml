# 사이트 배포 + 글별 검색·공유 페이지 자동 생성
# - main 브랜치에 코드가 올라올 때, 15분마다(7·22·37·52분), 또는 Actions 화면의 "Run workflow" 버튼으로 실행
# - 발행된 글을 읽어 p/<글번호>/ 페이지, og/ 썸네일, sitemap.xml을 만든 뒤 GitHub Pages에 배포
name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install image tool
        run: npm install --no-save --no-package-lock sharp@0.33
      - name: Build pages
        run: node scripts/build-pages.mjs _site
      # 새 글·수정 글이 있을 때만 Vercel(대표 주소)을 다시 배포해 사이트맵·RSS·글 페이지를 최신으로 유지
      # 준비: Vercel 프로젝트 Settings > Git > Deploy Hooks 주소를 GitHub 저장소 Secrets의 VERCEL_DEPLOY_HOOK에 저장
      - name: Refresh Vercel when posts change
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "VERCEL_DEPLOY_HOOK 없음 - 건너뜀"; exit 0; fi
          live=$(curl -fsS https://slow-days-blog.vercel.app/p/version.json || echo none)
          new=$(cat _site/p/version.json)
          if [ "$live" != "$new" ]; then curl -fsS -X POST "$HOOK" > /dev/null && echo "글 변경 감지 - Vercel 재배포 요청"; else echo "변경 없음"; fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
