# 사이트 배포 + 글별 검색·공유 페이지 자동 생성
# - main 브랜치에 코드가 올라올 때, 매시 17분, 또는 Actions 화면의 "Run workflow" 버튼으로 실행
# - 발행된 글을 읽어 p/<글번호>/ 페이지, og/ 썸네일, sitemap.xml을 만든 뒤 GitHub Pages에 배포
name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install image tool
        run: npm install --no-save --no-package-lock sharp@0.33
      - name: Build pages
        run: node scripts/build-pages.mjs _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
