<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/1117-blog-design/assets/favicon.svg" type="image/svg+xml">
<title>페이지를 찾을 수 없어요 — slow days</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/1117-blog-design/assets/style.css?v=6">
<style>
  .nf { padding:120px 24px 80px; text-align:center; }
  .nf .logo { display:inline-block; font-size:calc(var(--pw-title) * 2); line-height:1; font-weight:600; letter-spacing:-.045em; }
  .nf h1 { margin:56px 0 12px; font-size:var(--pw-title); line-height:1.1; font-weight:400; }
  .nf p { margin:0 0 28px; font-size:var(--pw-meta); color:var(--sub); }
  .nf .go { display:flex; justify-content:center; gap:20px; flex-wrap:wrap; font-size:var(--pw-meta); text-transform:uppercase; }
  .nf .go a { border-bottom:1px solid currentColor; padding-block:6px; }
  .more { margin-top:120px; }
  .more h2.t { margin:0 0 48px; text-align:center; font-size:var(--pw-meta); font-weight:400; text-transform:uppercase; }
</style>
</head>
<body>
<div id="side"></div>
<main class="nf">
  <a class="logo" href="/1117-blog-design/">slow days</a>
  <h1>찾으시는 페이지가 없어요</h1>
  <p>주소가 바뀌었거나 삭제된 글일 수 있어요. 최근 글이나 전체 글 목록에서 찾아보세요.</p>
  <div class="go">
    <a href="/1117-blog-design/list/">전체 글 보기 · All Stories</a>
    <a href="/1117-blog-design/list/?search=1">글 검색 · Search</a>
    <a href="/1117-blog-design/">처음으로 · Home</a>
  </div>
</main>
<section class="more with-side" aria-label="최근 글"><h2 class="t">Latest Stories 최근 글</h2><div class="grid3" id="more"></div></section>
<script type="module">
import { getPublished, cardHTML, sideHTML } from "/1117-blog-design/assets/fb.js?v=5";
import { pageView } from "/1117-blog-design/assets/ga.js?v=4";
const B = "/1117-blog-design/";
document.getElementById("side").outerHTML = sideHTML(B, "");
pageView({ page_type: "not_found", page_title: "404" });
try {
  const list = (await getPublished()).slice(0, 3);
  document.getElementById("more").innerHTML = list.map((p, i) => cardHTML(p, i, B, "h3")).join("");
  if (!list.length) document.querySelector(".more").remove();
} catch (e) { console.error(e); }
</script>
</body>
</html>
