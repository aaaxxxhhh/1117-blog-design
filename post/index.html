<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글 — slow days</title>
<meta name="description" content="slow days — 느리게 보는 생활 기록">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400&family=IBM+Plex+Mono&display=swap">
<link rel="stylesheet" href="../assets/style.css?v=5">
<style>
  /* PW 글 상세와 같은 크기·위치 (1440px: 제목 27.424px · 대표 사진 36.2vw · 도입 17.6px 세리프 · 본문 14.4px 28.6vw) */
  /* 상단 로고: 영문+한글 제목 두 줄과 같은 높이(제목 크기 × 2) · 모든 글 상세에서 같은 위치에 고정 */
  :root { --logo-fs:calc(var(--pw-title) * 2); --logo-h:calc(var(--logo-fs) + 32px); }
  body { padding-top:var(--logo-h); }
  .top-logo { position:fixed; left:0; right:0; top:0; height:var(--logo-h); display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.96); z-index:6; }
  .top-logo a { font-size:var(--logo-fs); line-height:1; font-weight:600; letter-spacing:-.045em; white-space:nowrap; }
  article { padding:0 24px; }
  .head { text-align:center; padding-top:56px; }
  .head h1, .head .ko { margin:0; font-size:var(--pw-title); line-height:1; font-weight:400; text-transform:uppercase; }
  .head .by { margin:25px 0 0; font-size:var(--pw-meta); line-height:1.4; }
  .col { margin:0 auto; width:36.2vw; }
  .cover { margin:120px auto 0; width:36.2vw; }
  .cover .ph { aspect-ratio:2/3; }
  figcaption { font-family:var(--mono); font-size:var(--pw-side); line-height:1.4; text-transform:uppercase; margin-top:4px; }
  .intro { margin-top:64px; font-family:var(--serif); font-size:17.6px; line-height:1.5; }
  .intro p { margin:0 0 22px; }
  .body { margin:48px auto 0; width:36.2vw; padding-left:7.6vw; font-size:14.4px; line-height:1.45; }
  .body p { margin:0 0 20px; }
  .body h3.sub { margin:48px 0 14px; font-size:var(--pw-side); font-weight:500; text-transform:uppercase; color:var(--sub); display:flex; gap:12px; }
  .body blockquote { margin:96px 0 96px calc(123px - 39.5vw); width:calc(100vw - 147px); text-align:center; font-family:var(--serif); font-size:var(--pw-title); line-height:1.1; }
  .body figure { margin:72px 0; }
  .body figure.spread { margin-left:calc(123px - 39.5vw); width:calc(100vw - 147px); }
  .body figure.spread > div { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px; }
  .tags { font-size:var(--pw-meta); color:var(--sub); }
  .share { display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-top:56px; padding-top:12px; border-top:1px solid var(--ink); font-size:var(--pw-meta); text-transform:uppercase; }
  .share a, .share button { display:flex; align-items:center; min-height:32px; border:0; background:none; padding:0; cursor:pointer; text-transform:inherit; font-size:inherit; }
  .more { margin-top:200px; }
  .more h2.t { margin:0 0 56px; text-align:center; font-size:var(--pw-meta); font-weight:400; text-transform:uppercase; }
  .foot { margin-top:160px; display:flex; justify-content:space-between; gap:6px 16px; padding:14px 24px max(20px, env(safe-area-inset-bottom)) 133px; border-top:1px solid var(--line, #E0DEDA); font-family:var(--mono); font-size:var(--pw-side); line-height:1.5; text-transform:uppercase; flex-wrap:wrap; }
  .foot span { min-width:0; overflow-wrap:anywhere; }
  @media (max-width:1023px) {
    .side { top:var(--logo-h); z-index:5; }
    article { padding:0 var(--pw-pad); }
    .head { padding-top:40px; }
    .cover { margin:44px 0 0 26.3vw; width:39.3vw; }
    .col { margin-left:26.3vw; margin-right:0; width:47.5vw; }
    .intro { font-size:17px; }
    .body { margin:48px 0 0 26.3vw; width:47.5vw; padding-left:0; font-size:15.3px; }
    .body blockquote { margin:72px 0 72px -26.3vw; width:calc(100vw - 26px); }
    .body figure.spread { margin-left:-26.3vw; width:calc(100vw - 26px); }
    .foot { padding:14px var(--pw-pad) max(20px, env(safe-area-inset-bottom)); }
  }
  @media (max-width:640px) {
    .head { padding-top:30px; }
    .head h1, .head .ko { font-size:29.138px; }
    .cover, .col, .body { margin-left:0; width:100%; }
    .cover { margin-top:44px; }
    .body figure.spread, .body blockquote { margin-left:0; width:100%; }
    .body figure.spread > div { grid-template-columns:1fr; }
    .body blockquote { font-size:23.8px; }
  }
</style>
</head>
<body>
<div class="top-logo"><a href="../">slow days</a></div>
<div id="side"></div>
<article id="art"><p class="empty">글을 불러오는 중…</p></article>
<section class="more with-side" aria-label="다음에 읽을 글"><h2 class="t">More Stories 다음에 읽을 글</h2><div class="grid3" id="more"></div></section>
<div class="foot" id="foot"></div>

<script type="module">
import { pageView, track, watchReading, shareUrl } from "../assets/ga.js?v=3";
import { getPost, getPublished, sideHTML, esc, fmtDate, renderBody, cardHTML, photo, hydrateImages, CAT_EN } from "../assets/fb.js?v=4";
const qs = new URLSearchParams(location.search);
const staticId = document.documentElement.dataset.postId || "";
const id = staticId || qs.get("id");
// 예전 주소(post/?id=)로 들어오면, 검색·공유용 글 페이지(p/글번호/)가 만들어져 있을 때 그 주소로 이동
if (!staticId && id) {
  try {
    const target = `../p/${encodeURIComponent(id)}/`;
    const r = await fetch(target, { method: "HEAD", cache: "no-store" });
    if (r.ok) { qs.delete("id"); const rest = qs.toString(); location.replace(target + (rest ? "?" + rest : "") + location.hash); await new Promise(() => {}); }
  } catch {}
}
let p = null;
try { p = id ? await getPost(id) : null; } catch (e) { console.error(e); }
document.getElementById("side").outerHTML = sideHTML("../", p ? p.category : "");
const art = document.getElementById("art");
if (!p) {
  pageView({ post_id: id || "", not_found: true });
  art.innerHTML = `<p class="empty">글을 찾을 수 없어요. <a href="../list/" style="text-decoration:underline">글 목록으로 가기</a></p>`;
} else {
  document.title = `${p.titleKo || p.titleEn} — slow days`;
  const md = document.querySelector('meta[name="description"]'); if (md && !staticId) md.content = String(p.intro || "").replace(/\s+/g, " ").slice(0, 120);
  const intro = String(p.intro || "").split(/\n{2,}/).filter(Boolean).map((t) => `<p>${esc(t)}</p>`).join("");
  art.innerHTML = `
    <header class="head"><h1>${esc(p.titleEn)}</h1><p class="ko">${esc(p.titleKo)}</p>
      <p class="by">${esc(CAT_EN[p.category] || "")} by ${esc(p.author)}<br>${fmtDate(p.publishedAt)}</p></header>
    <figure class="cover">${photo(p, 3, "[대표 사진]")}${p.coverCredit ? `<figcaption>${esc(p.coverCredit)}</figcaption>` : ""}</figure>
    <div class="col intro">${intro}</div>
    <div class="body">${renderBody(p.body)}
      ${(p.tags || []).length ? `<p class="tags">${p.tags.map((t) => "#" + esc(t)).join(" ")}</p>` : ""}
      <div class="share"><a href="../list/">← 목록으로</a><button type="button" id="copy">링크 복사</button></div></div>`;
  if (p.coverId) art.querySelector(".cover .ph").innerHTML = `<img data-img="${esc(p.coverId)}" alt="${esc(p.titleKo || p.titleEn)}">`;
  hydrateImages(art);
  document.getElementById("copy").onclick = async (e) => {
    try {
      await navigator.clipboard.writeText(shareUrl(id)); e.target.textContent = "복사했어요";
      track("share", { method: "copy_link", content_type: "post", item_id: id, post_id: id, post_category: p.category });
    } catch { e.target.textContent = "복사 실패"; }
  };
  watchReading(art.querySelector(".body"), art.querySelector(".share"), { post_id: id, post_category: p.category });
  pageView({ post_id: id, post_category: p.category });
  document.getElementById("foot").innerHTML = `<span>${esc(CAT_EN[p.category] || "")}</span><span>${esc(p.titleEn)} · ${esc(p.titleKo)}</span><span>${fmtDate(p.publishedAt)}</span>`;
}
try {
  const others = (await getPublished()).filter((x) => x.id !== id).slice(0, 3);
  document.getElementById("more").innerHTML = others.map((x, i) => cardHTML(x, i + 1, "../", "h3")).join("");
  if (!others.length) document.querySelector(".more").remove();
} catch (e) { console.error(e); }
</script>
</body>
</html>
