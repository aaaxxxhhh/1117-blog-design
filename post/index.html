<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글 — slow days</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;500&family=IBM+Plex+Mono&display=swap">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .top-logo { display:flex; justify-content:center; padding-top:18px; }
  .top-logo a { font-size:16px; font-weight:600; letter-spacing:-.04em; }
  article { padding:0 24px; }
  .head { text-align:center; padding-top:60px; }
  .head h1, .head .ko { margin:0; font-size:34px; line-height:1.1; font-weight:400; text-transform:uppercase; }
  .head .by { margin:28px 0 0; font-size:12px; line-height:1.5; }
  .col { margin:0 auto; width:min(100%,480px); }
  .cover { margin:140px auto 0; width:min(100%,480px); }
  .cover .ph { aspect-ratio:2/3; }
  .mono, figcaption { font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; margin-top:6px; }
  .intro { margin-top:64px; font-family:'Noto Serif KR',serif; font-size:17px; line-height:1.75; }
  .intro p { margin:0 0 22px; }
  .body { margin-top:48px; font-size:14px; line-height:1.8; }
  .body p { margin:0 0 24px; }
  .body h3.sub { margin:48px 0 16px; font-size:10px; font-weight:500; text-transform:uppercase; letter-spacing:.04em; color:var(--sub); display:flex; gap:12px; }
  .body blockquote { margin:96px -170px; text-align:center; font-family:'Noto Serif KR',serif; font-size:28px; line-height:1.45; }
  .body figure { margin:72px 0; }
  .body figure.spread { margin-left:calc(50% - min(48vw,600px)); margin-right:calc(50% - min(48vw,600px)); }
  .body figure.spread > div { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px; }
  .tags { font-size:11px; color:var(--sub); }
  .share { display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-top:64px; padding-top:16px; border-top:1px solid var(--ink); font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  .share a, .share button { min-height:44px; display:flex; align-items:center; border:0; background:none; padding:0; cursor:pointer; text-transform:inherit; letter-spacing:inherit; font-size:inherit; }
  .more { margin-top:200px; padding:0 24px; }
  .more h2.t { margin:0 0 56px; text-align:center; font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:.06em; }
  .more .grid3 { max-width:1200px; margin:0 auto; }
  .more .card h3 { font-size:22px; }
  .foot { position:sticky; bottom:0; margin-top:160px; display:flex; justify-content:space-between; gap:16px; padding:10px 20px; background:rgba(255,255,255,.95); font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; flex-wrap:wrap; }
  @media (max-width:900px) { .body blockquote { margin:64px 0; font-size:22px; } }
</style>
</head>
<body>
<div class="top-logo"><a href="../">slow days</a></div>
<div id="side"></div>
<div class="with-side">
  <article id="art"><p class="empty">글을 불러오는 중…</p></article>
  <section class="more" aria-label="다음에 읽을 글"><h2 class="t">More Stories 다음에 읽을 글</h2><div class="grid3" id="more"></div></section>
  <div class="foot" id="foot"></div>
</div>

<script type="module">
import { getPost, getPublished, sideHTML, esc, fmtDate, renderBody, cardHTML, photo, CAT_EN } from "../assets/fb.js";
const id = new URLSearchParams(location.search).get("id");
let p = null;
try { p = id ? await getPost(id) : null; } catch (e) { console.error(e); }
document.getElementById("side").outerHTML = sideHTML("../", p ? p.category : "");
const art = document.getElementById("art");
if (!p) {
  art.innerHTML = `<p class="empty">글을 찾을 수 없어요. <a href="../list/" style="text-decoration:underline">글 목록으로 가기</a></p>`;
} else {
  document.title = `${p.titleKo || p.titleEn} — slow days`;
  const intro = String(p.intro || "").split(/\n{2,}/).filter(Boolean).map((t) => `<p>${esc(t)}</p>`).join("");
  art.innerHTML = `
    <header class="head"><h1>${esc(p.titleEn)}</h1><p class="ko">${esc(p.titleKo)}</p>
      <p class="by">${esc(CAT_EN[p.category] || "")} by ${esc(p.author)}<br>${fmtDate(p.publishedAt)}</p></header>
    <figure class="cover">${photo(p, 3, "[대표 사진]")}${p.coverCredit ? `<figcaption>${esc(p.coverCredit)}</figcaption>` : ""}</figure>
    <div class="col intro">${intro}</div>
    <div class="col body">${renderBody(p.body)}</div>
    <div class="col">${(p.tags || []).length ? `<p class="tags">${p.tags.map((t) => "#" + esc(t)).join(" ")}</p>` : ""}
      <div class="share"><a href="../list/">← 목록으로</a><button type="button" id="copy">링크 복사</button></div></div>`;
  document.getElementById("copy").onclick = async (e) => { try { await navigator.clipboard.writeText(location.href); e.target.textContent = "복사했어요"; } catch { e.target.textContent = "복사 실패"; } };
  document.getElementById("foot").innerHTML = `<span>${esc(CAT_EN[p.category] || "")}</span><span>${esc(p.titleEn)} · ${esc(p.titleKo)}</span><span>${fmtDate(p.publishedAt)}</span>`;
}
try {
  const others = (await getPublished()).filter((x) => x.id !== id).slice(0, 3);
  document.getElementById("more").innerHTML = others.map((x, i) => cardHTML(x, i + 1, "../", "h3")).join("");
  if (!others.length) document.querySelector(".more").remove();
} catch (e) { console.error(e); }
</script>
</body>
</html>
