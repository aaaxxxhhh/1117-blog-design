<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>글쓰기 — slow days</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../assets/style.css?v=4">
<style>
  .tb { display:flex; flex-wrap:wrap; border-bottom:1px solid var(--ink); text-transform:uppercase; }
  .tb button { height:36px; padding:0 12px; border:0; border-right:1px solid #E0DEDA; background:#fff; cursor:pointer; font-size:calc(var(--wsm-fs) - 2px); }
  .ed { border:1px solid var(--ink); gap:0 !important; }
  .ed textarea { width:100%; border:0; padding:12px; resize:vertical; line-height:1.7; font-size:var(--wsm-fs); min-height:340px; }
  .cover-prev { aspect-ratio:2/3; width:140px; }
  .drop { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; min-height:180px; border:1px dashed #8A8A8A; background:#F7F6F4; cursor:pointer; text-align:center; padding:20px; }
  .drop.over { border-color:var(--ink); background:#EFEDE9; }
  .actions { display:flex; justify-content:flex-end; align-items:center; gap:10px; flex-wrap:wrap; margin-top:40px; padding:16px 0; border-top:1px solid var(--ink); }
</style>
</head>
<body>
<header class="wsm-top">
  <nav class="icons" aria-label="빠른 메뉴">
    <a class="icon" href="../admin/" aria-label="관리자 글 관리로"><svg aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="#111" stroke-width="1.3"><line x1="1" y1="5" x2="19" y2="5"/><line x1="1" y1="10" x2="19" y2="10"/><line x1="1" y1="15" x2="19" y2="15"/></svg></a>
  </nav>
  <div class="right"><a class="logo-s" href="../">slow days</a><span class="dot" aria-hidden="true"></span><a href="../admin/">관리자</a></div>
</header>

<p class="empty" id="wait">로그인 상태를 확인하는 중…</p>

<form class="wsm-page" id="f" hidden>
  <h1 class="wsm-title" id="ttl">Write a Story 새 글 쓰기</h1>
  <div>
    <div class="row2"><p class="lab">제목 Title</p><div class="fld">
      <label for="titleEn" class="hint">영문 제목 (목록에서 대문자로 보여요)</label>
      <input id="titleEn" class="line-in" style="text-transform:uppercase" required>
      <label for="titleKo" class="hint" style="margin-top:8px">한글 제목</label>
      <input id="titleKo" class="line-in" required>
    </div></div>

    <div class="row2"><p class="lab">분류 · 작성자 Category</p><div class="fld" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px">
      <div style="display:flex;flex-direction:column;gap:6px"><label for="category" class="hint">분류</label>
        <select id="category" class="box-in"><option value="essay">에세이 Essay</option><option value="daily">일상 Daily</option><option value="space">공간 Space</option><option value="books">책 Books</option></select></div>
      <div style="display:flex;flex-direction:column;gap:6px"><label for="author" class="hint">작성자</label>
        <input id="author" class="box-in" required></div>
    </div></div>

    <div class="row2"><p class="lab">대표 사진 Cover</p><div class="fld">
      <label for="coverFile" class="drop" id="drop">
        <span style="font-weight:600">사진을 끌어다 놓거나 눌러서 고르세요</span>
        <span class="hint">JPG · PNG · WEBP / 세로 2:3 권장 / 큰 사진은 자동으로 줄여서 저장해요</span>
      </label>
      <input id="coverFile" type="file" accept="image/jpeg,image/png,image/webp" class="sr">
      <div style="display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap">
        <div class="cover-prev ph" id="coverPrev" style="--tone:#D9D4CC">[미리보기]</div>
        <button type="button" class="btn" id="coverDel" hidden>사진 빼기</button>
      </div>
      <label for="coverCredit" class="hint" style="margin-top:8px">사진 출처 (사진 아래 작은 글씨로 보여요)</label>
      <input id="coverCredit" class="line-in" placeholder="Photo by ">
    </div></div>

    <div class="row2"><p class="lab">도입 문단 Intro</p><div class="fld">
      <label for="intro" class="hint">글 상세 맨 위에 세리프 글꼴로 크게 보여요 (3~4문장)</label>
      <textarea id="intro" class="box-in" rows="4"></textarea>
    </div></div>

    <div class="row2"><p class="lab">본문 Story<span class="hint" style="display:block;font-weight:400;margin-top:6px;max-width:300px">버튼을 누르면 표시가 들어가요.<br>## 소제목 · **굵게** · > 인용구<br>"사진 넣기"를 누르면 사진 파일을 골라 올려요<br>[글자](링크 주소)<br>문단 사이는 한 줄을 비워 주세요.</span></p>
      <div class="fld ed">
        <div class="tb" role="toolbar" aria-label="본문 꾸미기">
          <button type="button" data-ins="\n\n## 소제목\n\n">소제목</button>
          <button type="button" data-wrap="**">굵게</button>
          <button type="button" data-up="1">사진 넣기</button>
          <button type="button" data-up="2">사진 2장 펼침</button>
          <button type="button" data-ins="\n\n> 인용할 문장\n\n">인용구</button>
          <button type="button" data-ins="[링크 글자](https://)">링크</button>
        </div>
        <input id="bodyFile" type="file" accept="image/jpeg,image/png,image/webp" multiple class="sr" tabindex="-1" aria-hidden="true">
        <label for="body" class="sr">본문</label>
        <textarea id="body" placeholder="이야기를 시작해 보세요."></textarea>
      </div>
    </div>

    <div class="row2"><p class="lab">태그 Tags</p><div class="fld">
      <label for="tags" class="hint">쉼표(,)로 구분해 입력하세요</label>
      <input id="tags" class="line-in" placeholder="물건, 기록, 11월">
    </div></div>

    <div class="row2"><p class="lab">발행 설정 Publish</p><div class="fld" style="flex-direction:row;flex-wrap:wrap;gap:24px;align-items:flex-end">
      <div style="display:flex;flex-direction:column;gap:6px"><label for="pubdate" class="hint">발행일 (비워 두면 지금 발행 · 미래 날짜면 예약 발행)</label>
        <input id="pubdate" class="box-in" type="date"></div>
    </div></div>
  </div>

  <div class="actions">
    <p class="msg" id="msg" role="status" style="margin-right:auto"></p>
    <button type="button" class="btn" id="draftBtn">임시 저장</button>
    <button type="button" class="btn" id="prevBtn" hidden>미리보기</button>
    <button type="submit" class="btn dark" id="pubBtn">발행하기</button>
  </div>
</form>
<footer class="wsm-foot">© 2026 slow days · 관리자 전용 화면</footer>

<script type="module">
import { onUser, getPost, savePost, uploadImage, fileToDataURL, getImage, esc, safeSrc, fmtDate } from "../assets/fb.js?v=4";
const $ = (id) => document.getElementById(id);
let id = new URLSearchParams(location.search).get("id");
const F = ["titleEn", "titleKo", "category", "author", "coverCredit", "intro", "body"];
let cover = { id: "", thumb: "", file: null };

onUser(async (user) => {
  if (!user) { location.replace("../admin/"); return; }
  if (id) {
    const p = await getPost(id).catch(() => null);
    if (p) {
      F.forEach((k) => ($(k).value = p[k] || ""));
      $("tags").value = (p.tags || []).join(", ");
      if (p.publishedAt) $("pubdate").value = fmtDate(p.publishedAt).replaceAll(".", "-");
      $("ttl").textContent = "Edit Story 글 수정";
      $("prevBtn").hidden = false;
      cover = { id: p.coverId || "", thumb: p.coverThumb || "", file: null };
      showCover(cover.thumb);
      if (cover.id) getImage(cover.id).then((d) => d && showCover(d)).catch(() => {});
    } else id = null;
  }
  $("wait").hidden = true; $("f").hidden = false;
});

function showCover(src) {
  const u = safeSrc(src);
  $("coverPrev").innerHTML = u ? `<img src="${esc(u)}" alt="대표 사진 미리보기">` : "[미리보기]";
  $("coverDel").hidden = !u;
}
async function pickCover(file) {
  if (!file || !/^image\/(jpeg|png|webp)$/.test(file.type)) { $("msg").className = "msg err"; $("msg").textContent = "JPG · PNG · WEBP 사진만 올릴 수 있어요."; return; }
  cover.file = file; cover.thumb = await fileToDataURL(file, 600, 0.72); showCover(cover.thumb);
  $("msg").className = "msg"; $("msg").textContent = "대표 사진을 골랐어요. 저장할 때 함께 올라가요.";
}
$("coverFile").onchange = (e) => pickCover(e.target.files[0]);
$("coverDel").onclick = () => { cover = { id: "", thumb: "", file: null }; $("coverFile").value = ""; showCover(""); };
const drop = $("drop");
["dragenter", "dragover"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => pickCover(e.dataTransfer.files[0]));

let upCount = 1;
function insertAtCursor(text) {
  const t = $("body"), s = t.selectionStart, en = t.selectionEnd, v = t.value;
  t.value = v.slice(0, s) + text + v.slice(en); t.focus(); t.selectionStart = t.selectionEnd = s + text.length;
}
$("bodyFile").onchange = async (e) => {
  const files = [...e.target.files].slice(0, upCount); e.target.value = "";
  if (!files.length) return;
  $("msg").className = "msg"; $("msg").textContent = `사진 ${files.length}장을 올리는 중…`;
  try {
    const ids = [];
    for (const f of files) ids.push(await uploadImage(f));
    insertAtCursor("\n\n" + ids.map((id, i) => `![사진 설명 ${i + 1}](img:${id})`).join(" ") + "\n\n");
    $("msg").textContent = "사진을 넣었어요. [사진 설명] 글자는 원하는 설명으로 바꿔 주세요.";
  } catch (err) { console.error(err); $("msg").className = "msg err"; $("msg").textContent = "사진을 올리지 못했어요. 로그인 상태와 사진 파일을 확인해 주세요."; }
};

document.querySelector(".tb").onclick = (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.up) { upCount = Number(b.dataset.up); $("bodyFile").click(); return; }
  const t = $("body"), s = t.selectionStart, en = t.selectionEnd, v = t.value;
  const ins = b.dataset.wrap ? b.dataset.wrap + (v.slice(s, en) || "굵게 할 글자") + b.dataset.wrap : b.dataset.ins.replace(/\\n/g, "\n");
  t.value = v.slice(0, s) + ins + v.slice(en); t.focus(); t.selectionStart = t.selectionEnd = s + ins.length;
};

async function save(status) {
  if (!$("f").reportValidity()) return;
  const data = Object.fromEntries(F.map((k) => [k, $(k).value.trim()]));
  data.tags = $("tags").value.split(",").map((s) => s.trim()).filter(Boolean);
  data.status = status;
  $("msg").className = "msg"; $("msg").textContent = "저장하는 중…";
  if (cover.file) { try { cover.id = await uploadImage(cover.file); cover.file = null; } catch (err) { console.error(err); $("msg").className = "msg err"; $("msg").textContent = "대표 사진을 올리지 못했어요."; return; } }
  data.coverId = cover.id; data.coverThumb = cover.thumb; data.coverUrl = "";
  if ($("pubdate").value) data.publishedAtStr = $("pubdate").value;
  $("msg").className = "msg"; $("msg").textContent = "저장하는 중…";
  ["draftBtn", "pubBtn"].forEach((k) => ($(k).disabled = true));
  try {
    id = await savePost(id, data);
    if (status === "published") { location.href = `../post/?id=${encodeURIComponent(id)}`; return; }
    $("msg").textContent = "임시 저장했어요."; $("prevBtn").hidden = false;
    history.replaceState(null, "", `?id=${encodeURIComponent(id)}`);
  } catch (e) { console.error(e); $("msg").className = "msg err"; $("msg").textContent = "저장하지 못했어요. 관리자 계정으로 로그인했는지 확인해 주세요."; }
  ["draftBtn", "pubBtn"].forEach((k) => ($(k).disabled = false));
}
$("f").onsubmit = (e) => { e.preventDefault(); save("published"); };
$("draftBtn").onclick = () => save("draft");
$("prevBtn").onclick = () => window.open(`../post/?id=${encodeURIComponent(id)}`, "_blank");
</script>
</body>
</html>
